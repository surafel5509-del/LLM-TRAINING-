services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: forgeml
      POSTGRES_USER: forgeml
      POSTGRES_PASSWORD: forgeml
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./docker/backend
    environment:
      DATABASE_URL: postgresql+psycopg://forgeml:forgeml@db:5432/forgeml
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: ["./storage:/app/storage"]
    depends_on: [db]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
volumes:
  pgdata:
